<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/output.css" />
    <script src="scripts/tipCalc.js" defer></script>
  </head>

  <body class="flex flex-col h-screen">
    <nav class="navbar"><img src="./images/logo.svg" /></nav>
    <main class="flex-1">
      <div class="grid grid-cols-1 md:grid-cols-2 h-full">
        <div
          class="flex justify-center border-r-2 border-dashed border-[#3f3f46] p-8"
        >
          <form id="tipCalc" class="w-[80%] mt-20">
            <div class="form-group m-5">
              <label class="font-bold text-xl" for="waiter">Waiter</label>
              <select
                required
                name="waiterList"
                id="waiterList"
                class="border-2 text-white font-bold text-xl border-[#1b5e20] outline-none focus:ring-[#1b5e20] rounded-md px-4 py-2"
              >
                <option value="" selected disabled hidden></option>
                <option value="Jared">Jared</option>
                <option value="Lawrence">Lawrence</option>
                <option value="Sarah">Sarah</option>
                <option value="Jess">Jess</option>
              </select>
            </div>

            <div class="form-group m-5">
              <label class="font-bold text-xl" for="tableNo"
                >Table Number</label
              >
              <select
                required
                name="tableNo"
                id="tableNo"
                class="border-2 border-[#1b5e20] text-white font-bold text-xl outline-none focus:ring-[#1b5e20] rounded-md px-4 py-2"
              >
                <option value="" selected disabled hidden></option>
                <option value="Table 1">Table 1</option>
                <option value="Table 2">Table 2</option>
                <option value="Table 3">Table 3</option>
                <option value="Table 4">Table 4</option>
              </select>
            </div>

            <div class="form-group m-5">
              <label class="font-bold text-xl" for="amount">Bill amount</label>
              <input
                type="number"
                class="border-2 border-[#1b5e20] text-white font-bold text-xl focus:border-[#1b5e20] outline-none focus:ring-[#1b5e20] rounded-md px-4 py-2"
                id="amount"
                name="amount"
                required
              />
            </div>

            <div class="form-group m-5">
              <label class="font-bold text-xl" for="currency">Currency</label>
              <select
                required
                name="currency"
                id="currency"
                class="border-2 border-[#1b5e20] text-white font-bold text-xl outline-none focus:ring-[#1b5e20] rounded-md px-4 py-2"
              >
                <option value="" selected disabled hidden></option>
                <option value="ZAR">South African Rand</option>
                <option value="USD">US Dollar</option>
                <option value="GBP">Pound Sterling</option>
                <option value="JPY">Japanese Yen</option>
              </select>
            </div>
            <div class="form-group m-5">
              <button
                id="testButton"
                type="submit"
                type="button"
                class="border-2 bg-[#1b5e20] border-[#1b5e20] text-xl font-bold text-white w-full focus:border-[#1b5e20] rounded-md px-4 py-2"
                onclick=""
              >
                Submit
              </button>
            </div>
          </form>
        </div>
        <div class="flex flex-col w-[80%] mx-auto">
          <div class="p-8 mt-20">
            <p class="m-5 flex font-light justify-center tracking-wide">
              RECEIPT
            </p>
            <div class="border-b-2 border-dashed mb-8 border-[#3f3f46]">
              <div class="flex justify-between text-[16px] mb-2">
                <span class="text-white">Waiter</span>
                <span class="text-white">""</span>
              </div>
              <div class="flex justify-between text-[16px] mb-2">
                <span class="text-white">Table</span>
                <span class="text-white">""</span>
              </div>
            </div>
            <div class="border-b-2 border-dashed mb-8 border-[#3f3f46]">
              <div class="flex justify-between text-[16px] mb-2">
                <span class="text-white">Bill</span>
                <span class="text-white">""</span>
              </div>
              <div class="flex justify-between text-[16px] mb-2">
                <span class="text-white">Tip (10%)</span>
                <span class="text-white">""</span>
              </div>
            </div>
            <div class="mb-8">
              <div class="flex justify-between text-[16px] mb-2">
                <span class="text-white">Bill</span>
                <span class="text-white">""</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
